# Optional override: docker compose -f compose.yaml -f compose.turn.yaml up -d --build
# TCP/TLS 443 fallback needs a separate IP/host; this example exposes 3478 only.
services:
  turn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - --no-cli
      - --no-tls
      - --no-tcp-relay
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
      - --realm=${DOMAIN:?Set DOMAIN}
      - --external-ip=${TURN_PUBLIC_IP:?Set the public IPv4 address}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-software-attribute
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --user-quota=6
      - --total-quota=24
      - --relay-threads=1
      - --sock-buf-size=262144
      - --max-bps=250000
      - --bps-capacity=6000000
      - --unauthorized-ratelimit
      - --unauthorized-ratelimit-rps=5
      - --log-file=stdout
    cpus: "0.50"
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
    security_opt: ["no-new-privileges:true"]
